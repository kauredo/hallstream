name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      # The overlay tests skip on a machine with no Chrome. The runner image
      # has one: this fails the job if that stops being true.
      - run: google-chrome --version
      - run: go test ./...
      - run: go build -o /dev/null ./cmd/hallstream
      # The Linux release is a static binary with no cgo.
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/hallstream
      - run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/hallstream
      # The release ships a 32-bit exe for the old hall PCs.
      - run: GOOS=windows GOARCH=386 go build -o /dev/null ./cmd/hallstream

  macos:
    # The Bluetooth library uses CoreBluetooth through cgo, so the macOS build
    # runs on a Mac instead of cross-compiling.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o /dev/null ./cmd/hallstream
      # The Mac app is universal and starts on macOS 13.
      - run: MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 GOARCH=amd64 go build -o /dev/null ./cmd/hallstream
      - run: MACOSX_DEPLOYMENT_TARGET=13.0 CGO_ENABLED=1 GOARCH=arm64 go build -o /dev/null ./cmd/hallstream
