name: Release

# Push a tag like v1.2.0 to publish a release: CI tests, builds both Windows
# exes and the zip with build.sh, publishes the release with its checksum, and
# rebuilds hallstream.com so the download button names the new version.
# A pull request that touches the release machinery, or a manual run, builds
# the zip as a dry run and keeps it as an artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build.sh
      - scripts/notices.sh
      - winres/**
      - LEIA-ME.txt
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Public releases never upload game logs: the website promises it.
      HALLSTREAM_UPLOAD_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # build.sh is a zsh script.
      - run: sudo apt-get install -y --no-install-recommends zsh

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          else
            v="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      # The overlay tests skip without Chrome; the runner has one.
      - run: google-chrome --version

      # build.sh runs the tests first, then builds dist/Hallstream-<version>.zip.
      - run: zsh ./build.sh "${{ steps.version.outputs.version }}"

      - name: Check the zip and write its checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          zip="Hallstream-$VERSION.zip"
          want=$'Hallstream (32-bit).exe\nHallstream.exe\nLEIA-ME.txt\nLICENSE.txt\nTHIRD-PARTY-NOTICES.txt\nYouTube/LIGAR-YOUTUBE.txt'
          got=$(zipinfo -1 "$zip" | LC_ALL=C sort)
          [[ "$got" == "$want" ]] || { echo "Unexpected zip contents:"; echo "$got"; exit 1; }
          sha256sum "$zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Keep the zip (dry runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Hallstream-${{ steps.version.outputs.version }}
          path: |
            dist/Hallstream-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Hallstream-${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS
          generate_release_notes: true

      # A release published with GITHUB_TOKEN starts no other workflow, so
      # site.yml would not fire: the hook is called here instead.
      - name: Rebuild the website
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "VERCEL_DEPLOY_HOOK is not set"; exit 1; }
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK" -o /dev/null
