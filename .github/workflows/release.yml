name: Release

# Push a tag like v1.2.0 to publish a release: CI tests, builds both Windows
# exes and the zip, and a signed and notarised Mac app in a DMG, with build.sh,
# publishes the release with their checksums, and rebuilds hallstream.com so
# the download button names the new version.
# A pull request that touches the release machinery, or a manual run, builds
# the same files as a dry run (the Mac app unsigned) and keeps them as
# artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build.sh
      - scripts/notices.sh
      - winres/**
      - macres/**
      - LEIA-ME.txt
      - READ-ME.txt
      - docs/youtube/**
      - docs/cameras/**
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # Public releases never upload game logs: the website promises it.
  HALLSTREAM_UPLOAD_TOKEN: ""
  # The feedback worker (worker/README.md); empty leaves only the GitHub link.
  HALLSTREAM_FEEDBACK_URL: ${{ vars.HALLSTREAM_FEEDBACK_URL }}

jobs:
  windows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # build.sh is a zsh script.
      - run: sudo apt-get install -y --no-install-recommends zsh

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          else
            v="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      # The overlay tests skip without Chrome; the runner has one.
      - run: google-chrome --version

      # build.sh runs the tests first, then builds dist/Hallstream-<version>.zip.
      - run: zsh ./build.sh "${{ steps.version.outputs.version }}"

      - name: Check the zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          zip="Hallstream-$VERSION.zip"
          want=$'CAMARAS.txt\nCAMERAS.txt\nHallstream (32-bit).exe\nHallstream.exe\nLEIA-ME.txt\nLICENSE.txt\nREAD-ME.txt\nTHIRD-PARTY-NOTICES.txt\nYouTube/CONNECT-YOUTUBE.txt\nYouTube/LIGAR-YOUTUBE.txt'
          got=$(zipinfo -1 "$zip" | LC_ALL=C sort)
          [[ "$got" == "$want" ]] || { echo "Unexpected zip contents:"; echo "$got"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Hallstream-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # build.sh builds with -a, so a restored cache can't link objects built
      # for a newer macOS than the app's minimum.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          else
            v="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # A release never ships an unsigned Mac app.
      - name: Check the Apple secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          exit $missing

      - name: Say the dry run is unsigned
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: echo "::notice::Dry run, so the Mac app keeps its ad-hoc signature and is not notarised. Remove the quarantine to open it."

      - run: go vet ./...

      # On tags build.sh leaves the DMG to the signing steps below.
      - name: Build the app
        env:
          HALLSTREAM_SIGN: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '' }}
        run: zsh ./build.sh "${{ steps.version.outputs.version }}" macos

      - name: Import the signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PWD=$(uuidgen)
          P8="$RUNNER_TEMP/AuthKey.p8"
          {
            echo "CERT_PATH=$CERT_PATH"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "P8=$P8"
          } >> "$GITHUB_ENV"

          echo -n "$MACOS_CERTIFICATE" | base64 -d > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" >/dev/null
          read -ra EXISTING_KEYCHAINS <<< "$(security list-keychain -d user | sed -e 's/[[:space:]]*"//g' -e 's/"$//g' | tr '\n' ' ')"
          security list-keychain -d user -s "$KEYCHAIN_PATH" "${EXISTING_KEYCHAINS[@]}"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$IDENTITY" ] || { echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          echo -n "$APPLE_API_KEY" | base64 -d > "$P8"

      - name: Sign and notarise the app, then the DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notarise() {
            local out="$RUNNER_TEMP/notary.json" status id
            xcrun notarytool submit "$1" --key "$P8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 30m --output-format json > "$out" || true
            cat "$out"
            status=$(plutil -extract status raw -o - "$out")
            id=$(plutil -extract id raw -o - "$out")
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$id" --key "$P8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
              echo "::error::Notarisation of $1 ended as $status"
              exit 1
            fi
          }

          app=dist/mac/Hallstream.app
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Hallstream.zip"
          notarise "$RUNNER_TEMP/Hallstream.zip"
          # Stapled, the app opens on a Mac with no internet.
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          rm -rf dist/mac-dmg/Hallstream.app
          ditto "$app" dist/mac-dmg/Hallstream.app

          dmg="dist/Hallstream-$VERSION-macos.dmg"
          hdiutil create -volname Hallstream -srcfolder dist/mac-dmg -ov -format UDZO "$dmg"
          codesign --timestamp --sign "$IDENTITY" "$dmg"
          notarise "$dmg"
          xcrun stapler staple "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"

      - name: Check the DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          mnt="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "dist/Hallstream-$VERSION-macos.dmg"
          want=$'.\n./Applications\n./CAMARAS.txt\n./CAMERAS.txt\n./Hallstream.app\n./LEIA-ME.txt\n./LICENSE.txt\n./READ-ME.txt\n./THIRD-PARTY-NOTICES.txt\n./YouTube\n./YouTube/CONNECT-YOUTUBE.txt\n./YouTube/LIGAR-YOUTUBE.txt'
          got=$(cd "$mnt" && find . -maxdepth 2 ! -path './Hallstream.app/*' | LC_ALL=C sort)
          [[ "$got" == "$want" ]] || { echo "Unexpected DMG contents:"; echo "$got"; exit 1; }
          lipo -archs "$mnt/Hallstream.app/Contents/MacOS/Hallstream"
          if [ "$TAG" = true ]; then
            spctl -a -t exec -vv "$mnt/Hallstream.app" 2>&1 | tee "$RUNNER_TEMP/spctl-app.txt"
            grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl-app.txt"
          fi
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Hallstream-${{ steps.version.outputs.version }}-macos.dmg
          if-no-files-found: error

      - name: Remove the signing keychain and keys
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "${CERT_PATH:-}" "${P8:-}"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          v="${VERSION#v}"
          cd dist
          sha256sum "Hallstream-$v.zip" "Hallstream-$v-macos.dmg" > SHA256SUMS
          cat SHA256SUMS
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Hallstream-${{ env.VERSION }}.zip
            dist/Hallstream-${{ env.VERSION }}-macos.dmg
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

      # A release published with GITHUB_TOKEN starts no other workflow, so
      # site.yml would not fire: the hook is called here instead.
      - name: Rebuild the website
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "VERCEL_DEPLOY_HOOK is not set"; exit 1; }
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK" -o /dev/null
