<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Marcador Divisa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Graduate&amp;family=Barlow+Condensed:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dg-fill{clip-path:polygon(26.58px 0,53px 0,53px 125px,0 125px)}
.dg-white{clip-path:polygon(26.58px 0,32.58px 0,6px 125px,0 125px)}
.dg-navy{clip-path:polygon(32.58px 0,52.58px 0,26px 125px,6px 125px)}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #2A1C12; font-family: 'Barlow Condensed', sans-serif">
<img class="bg" src="/_blob/9c2940bf8bca730ed6082a9a6d99b693" alt="Pavilhão Municipal do Vale">

<div style="position: absolute; left: 64px; bottom: 64px; display: flex; align-items: flex-end; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.4))">

<div style="position: relative; width: 53px; height: 125px; flex: none">
<div class="dg-fill" style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="height: 29px; background: #181841"></div>
<div style="height: 48px; background: #FFFFFF"></div>
<div style="height: 48px; background: #ECEAE6"></div>
</div>
<div class="dg-white" style="position: absolute; inset: 0; background: #FFFFFF"></div>
<div class="dg-navy" style="position: absolute; inset: 0; background: #181841"></div>
</div>

<div style="display: flex; flex-direction: column; width: 300px; flex: none">

<div style="height: 29px; background: #181841"></div>

<div style="height: 48px; display: flex">
<div style="position: relative; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #FFFFFF">
<img src="/_blob/594604fee97726efd14dc644fe154a1a" alt="Emblema do clube" style="height: 36px; width: 36px; object-fit: contain">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #BD1522"></div>
</div>
<div style="width: 180px; height: 48px; box-sizing: border-box; padding-left: 12px; display: flex; align-items: center; background: #BD1522; color: #FFFFFF; font-family: Graduate, serif; font-size: 24px; line-height: 1; white-space: nowrap; overflow: hidden">CASA</div>
<div style="width: 72px; height: 48px; display: flex; align-items: center; justify-content: center; background: #8B2223; color: #FFFFFF; font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums">{{home}}</div>
</div>

<div style="height: 48px; display: flex">
<div style="position: relative; width: 48px; height: 48px; background: #ECEAE6">
<div style="position: absolute; left: 5px; top: 2px; width: 38px; height: 38px; box-sizing: border-box; border: 2px dashed #B9B4AC; display: flex; align-items: center; justify-content: center; color: #8A8F9C; font-weight: 600; font-size: 11px; line-height: 1; white-space: nowrap">Emblema</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: {{awayColor}}"></div>
</div>
<div style="width: 180px; height: 48px; box-sizing: border-box; padding-left: 12px; display: flex; align-items: center; background: #FFFFFF; color: #181841; font-family: Graduate, serif; font-size: 24px; line-height: 1; white-space: nowrap; overflow: hidden">VISITANTE</div>
<div style="width: 72px; height: 48px; display: flex; align-items: center; justify-content: center; background: #ECEAE6; color: #181841; font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums">{{away}}</div>
</div>

</div>

<div style="display: flex; background: #181841; color: #FFFFFF; flex: none">

<div style="width: 10px; flex: none"></div>

<div style="width: 120px; display: flex; flex-direction: column">
<div style="height: 29px; display: flex; align-items: center; padding-left: 12px; color: rgba(255,255,255,0.72); font-weight: 700; font-size: 18px; line-height: 1; letter-spacing: 1.5px">FALTAS</div>
<div style="height: 48px; display: flex; align-items: center; gap: 8px; padding-left: 12px">
<div style="width: 16px; font-weight: 800; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; color: {{homeFoulColor}}">{{homeFouls}}</div>
<div style="display: flex; gap: 4px">
<sc-for list="{{homePips}}" as="p" hint-placeholder-count="5"><div style="width: 10px; height: 18px; background: {{p.color}}"></div></sc-for>
</div>
</div>
<div style="height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding-left: 12px; border-top: 2px solid rgba(255,255,255,0.14)">
<div style="width: 16px; font-weight: 800; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; color: {{awayFoulColor}}">{{awayFouls}}</div>
<div style="display: flex; gap: 4px">
<sc-for list="{{awayPips}}" as="p" hint-placeholder-count="5"><div style="width: 10px; height: 18px; background: {{p.color}}"></div></sc-for>
</div>
</div>
</div>

<div style="width: 2px; background: rgba(255,255,255,0.14)"></div>

<div style="width: 135px; display: flex; flex-direction: column">
<div style="height: 29px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: 1.5px">{{period}}</div>
<div style="height: 96px; box-sizing: border-box; padding: 4px 10px 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between">
<div style="font-weight: 800; font-size: 44px; line-height: 46px; font-variant-numeric: tabular-nums">{{clock}}</div>
<div style="width: 110px; height: 36px; display: flex; align-items: center; justify-content: center; gap: 8px; background: {{shotBg}}; color: {{shotInk}}">
<span style="font-weight: 700; font-size: 18px; line-height: 1; letter-spacing: 1px; color: #D6BD2F">24s</span>
<span style="font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; color: {{shotInk}}">{{shot}}</span>
</div>
</div>
</div>

</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"awayColor":{"editor":"color","default":"#8A8F9C","options":["#8A8F9C","#2E6FD8","#1F8A4C","#F2C200","#111111"]},"lastMinute":{"editor":"boolean","default":false},"homeFouls":{"editor":"int","default":2,"min":0,"max":9},"awayFouls":{"editor":"int","default":4,"min":0,"max":9},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const last = this.props.lastMinute ?? false;
const hf = this.props.homeFouls ?? 2;
const af = this.props.awayFouls ?? 4;
const hot = (n) => (n >= 4 ? '#D6BD2F' : '#FFFFFF');
const pips = (n) => [0, 1, 2, 3].map((i) => ({ color: i < n ? hot(n) : 'rgba(255,255,255,0.25)' }));
return {
awayColor: this.props.awayColor ?? '#8A8F9C',
home: last ? '78' : '41',
away: last ? '79' : '38',
period: last ? '4º PER.' : '2º PER.',
clock: last ? '9.4' : '07:45',
shot: last ? '3.2' : '14',
shotBg: '#181841',
shotInk: last ? '#D6BD2F' : '#FFFFFF',
homeFouls: String(hf),
awayFouls: String(af),
homeFoulColor: hot(hf),
awayFoulColor: hot(af),
homePips: pips(hf),
awayPips: pips(af)
};
}
}
</script>
</body>
</html>
