<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1A17">
<title data-i18n="marcar.pagina.titulo"></title>
<meta name="description" data-i18n-attr="content:marcar.pagina.descricao">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/marcar/marcar.css">
</head>
<body class="consola">
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="i-mais" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
  <symbol id="i-troca" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h11M10 2l3 3-3 3"/><path d="M14 11H3M6 8l-3 3 3 3"/></g></symbol>
  <symbol id="i-sai" viewBox="0 0 14 18"><path d="M7 2v13M2 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-entra" viewBox="0 0 14 18"><path d="M7 16V3M2 8l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<main class="mesa" id="mesa" hidden>
  <section class="equipa casa" data-team="home">
    <h2 class="nome" data-v="homeName"></h2>
    <output class="pontos" aria-live="polite"><span class="n" data-v="home"></span><span class="ultimo" data-last="home" hidden></span></output>
    <div class="somar" role="group" data-i18n-attr="aria-label:marcar.pontos_casa">
      <button type="button" data-do="point" data-n="1" data-long>+1</button>
      <button type="button" data-do="point" data-n="2" data-long>+2</button>
      <button type="button" data-do="point" data-n="3" data-long>+3</button>
    </div>
    <div class="registos">
      <div class="rec faltas"><span class="rotulo" data-i18n="marcar.faltas"></span><span class="valor"><b class="conta" data-v="homeFouls"></b><span class="aviso"></span></span></div>
      <div class="rec exclusoes"><span class="rotulo" data-i18n="marcar.exclusoes"></span><div class="chips" data-susp="home"></div></div>
      <div class="rec sets-rec"><span class="rotulo" data-i18n="marcar.sets"></span><span class="valor"><b class="conta" data-v="homeSets"></b></span></div>
      <div class="rec cartoes-rec"><span class="rotulo" data-i18n="marcar.cartoes"></span><div class="valor registo" data-registo="home"></div></div>
      <div class="rec trocas-rec"><span class="rotulo" data-i18n="marcar.substituicoes"></span><span class="valor" data-trocas="home"></span></div>
      <div class="rec descontos"><span class="rotulo" data-i18n="marcar.descontos"></span><span class="valor"><b class="conta" data-v="homeTimeoutsLeft"></b><span class="restam" data-v="homeTimeoutsWord"></span></span></div>
    </div>
    <div class="acoes">
      <button type="button" class="acao faltas" data-do="foul" data-n="1" data-long data-i18n-attr="aria-label:marcar.juntar_falta"><svg aria-hidden="true"><use href="#i-mais"/></svg><span data-i18n="marcar.falta"></span></button>
      <button type="button" class="acao exclusoes" data-do="suspension" data-n="1"><svg aria-hidden="true"><use href="#i-mais"/></svg><span data-i18n="marcar.exclusao"></span></button>
      <button type="button" class="acao servico" data-do="serve" data-n="1"><span data-i18n="marcar.servico"></span></button>
      <button type="button" class="acao cartao" data-pick="card"><i class="cs y" aria-hidden="true"></i><i class="cs r" aria-hidden="true"></i><span data-i18n="marcar.cartao"></span></button>
      <button type="button" class="acao troca" data-pick="sub"><svg aria-hidden="true"><use href="#i-troca"/></svg><span data-i18n="marcar.substituicao"></span></button>
      <button type="button" class="acao descontos" data-do="timeout" data-n="1" data-long data-i18n-attr="aria-label:marcar.pedir_desconto"><svg aria-hidden="true"><use href="#i-mais"/></svg><span data-i18n="marcar.desconto"></span></button>
    </div>
  </section>

  <section class="mesa-centro">
    <div class="estado" role="status"><i class="ponto" aria-hidden="true"></i><span id="estado"></span></div>
    <button type="button" class="periodo" id="periodoBotao"><span id="periodo"></span><svg aria-hidden="true" viewBox="0 0 18 18"><path d="M7 3.5l5.5 5.5L7 14.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button type="button" class="relogio" id="relogio" data-i18n-attr="aria-label:marcar.acertar_relogio"><span class="tempo" id="tempo"></span><span class="compensa" id="compensa"></span><svg class="lapis" aria-hidden="true" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5l3 3L5.5 13.5H2.5v-3z"/><path d="M9 4l3 3"/></g></svg></button>
    <div class="quadro-set" id="quadroSet">
      <span class="set-nome" id="setNome"></span>
      <p class="feitos" id="feitos"></p>
      <p class="falta" id="falta" hidden></p>
    </div>
    <button type="button" class="anular" id="anular" data-do="undo"><svg aria-hidden="true" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3L2 6l3 3"/><path d="M2 6h7.5a4 4 0 010 8H7"/></g></svg><span id="anularTexto"></span></button>
    <p class="dica" id="dica" data-i18n="marcar.dica_longo"></p>
    <button type="button" class="arrancar" id="arrancar"><svg class="ic-iniciar" aria-hidden="true" viewBox="0 0 18 18"><path d="M5 3l10 6-10 6z" fill="currentColor"/></svg><svg class="ic-parar" aria-hidden="true" viewBox="0 0 18 18"><path d="M6 3v12M12 3v12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg><span id="arrancarTexto"></span></button>
  </section>

  <section class="equipa fora" data-team="away">
    <h2 class="nome" data-v="awayName"></h2>
    <output class="pontos" aria-live="polite"><span class="n" data-v="away"></span><span class="ultimo" data-last="away" hidden></span></output>
    <div class="somar" role="group" data-i18n-attr="aria-label:marcar.pontos_fora">
      <button type="button" data-do="point" data-n="1" data-long>+1</button>
      <button type="button" data-do="point" data-n="2" data-long>+2</button>
      <button type="button" data-do="point" data-n="3" data-long>+3</button>
    </div>
    <div class="registos">
      <div class="rec faltas"><span class="rotulo" data-i18n="marcar.faltas"></span><span class="valor"><b class="conta" data-v="awayFouls"></b><span class="aviso"></span></span></div>
      <div class="rec exclusoes"><span class="rotulo" data-i18n="marcar.exclusoes"></span><div class="chips" data-susp="away"></div></div>
      <div class="rec sets-rec"><span class="rotulo" data-i18n="marcar.sets"></span><span class="valor"><b class="conta" data-v="awaySets"></b></span></div>
      <div class="rec cartoes-rec"><span class="rotulo" data-i18n="marcar.cartoes"></span><div class="valor registo" data-registo="away"></div></div>
      <div class="rec trocas-rec"><span class="rotulo" data-i18n="marcar.substituicoes"></span><span class="valor" data-trocas="away"></span></div>
      <div class="rec descontos"><span class="rotulo" data-i18n="marcar.descontos"></span><span class="valor"><b class="conta" data-v="awayTimeoutsLeft"></b><span class="restam" data-v="awayTimeoutsWord"></span></span></div>
    </div>
    <div class="acoes">
      <button type="button" class="acao faltas" data-do="foul" data-n="1" data-long data-i18n-attr="aria-label:marcar.juntar_falta"><svg aria-hidden="true"><use href="#i-mais"/></svg><span data-i18n="marcar.falta"></span></button>
      <button type="button" class="acao exclusoes" data-do="suspension" data-n="1"><svg aria-hidden="true"><use href="#i-mais"/></svg><span data-i18n="marcar.exclusao"></span></button>
      <button type="button" class="acao servico" data-do="serve" data-n="1"><span data-i18n="marcar.servico"></span></button>
      <button type="button" class="acao cartao" data-pick="card"><i class="cs y" aria-hidden="true"></i><i class="cs r" aria-hidden="true"></i><span data-i18n="marcar.cartao"></span></button>
      <button type="button" class="acao troca" data-pick="sub"><svg aria-hidden="true"><use href="#i-troca"/></svg><span data-i18n="marcar.substituicao"></span></button>
      <button type="button" class="acao descontos" data-do="timeout" data-n="1" data-long data-i18n-attr="aria-label:marcar.pedir_desconto"><svg aria-hidden="true"><use href="#i-mais"/></svg><span data-i18n="marcar.desconto"></span></button>
    </div>
  </section>
</main>

<div class="faixa" id="faixa" role="alert" hidden></div>

<div class="rodar"><p data-i18n-html="marcar.rodar"></p></div>

<dialog id="pin">
  <form method="dialog" id="pinForm">
    <h2 data-i18n="marcar.pin.titulo"></h2>
    <p data-i18n="marcar.pin.dica"></p>
    <input id="pinValue" inputmode="numeric" maxlength="4" autocomplete="off" data-i18n-attr="aria-label:marcar.pin.titulo">
    <p class="erro" id="pinMsg" role="alert"></p>
    <button type="submit" class="arrancar" data-i18n="marcar.pin.entrar"></button>
  </form>
</dialog>

<dialog id="periodos">
  <h2 id="periodosTitulo"></h2>
  <div class="botoes">
    <button type="button" class="anular" id="anterior" data-ask="period_back" data-i18n="marcar.periodo_anterior"></button>
    <button type="button" class="arrancar" id="seguinte"></button>
  </div>
  <p class="rotulo-dialogo" data-i18n="marcar.duracao"></p>
  <div class="passos duracao">
    <button type="button" data-length="-600">−1 min</button>
    <output id="duracao"></output>
    <button type="button" data-length="600">+1 min</button>
  </div>
  <button type="button" class="anular fechar" id="periodosFechar" data-i18n="marcar.feito"></button>
</dialog>

<!-- Setting the clock: steps that apply at once, so a running clock never jumps back by the time spent typing. -->
<dialog id="acertar">
  <h2 data-i18n="marcar.acertar.titulo"></h2>
  <p class="mostrador" id="acertarClock"></p>
  <div class="passos">
    <button type="button" data-do="clock_add" data-tenths="-600">−1 min</button>
    <button type="button" data-do="clock_add" data-tenths="-100">−10 s</button>
    <button type="button" data-do="clock_add" data-tenths="-10">−1 s</button>
    <button type="button" data-do="clock_add" data-tenths="600">+1 min</button>
    <button type="button" data-do="clock_add" data-tenths="100">+10 s</button>
    <button type="button" data-do="clock_add" data-tenths="10">+1 s</button>
  </div>
  <div class="compensacao" role="group" data-i18n-attr="aria-label:marcar.compensacao">
    <p class="rotulo-dialogo" data-i18n="marcar.compensacao"></p>
    <div class="passos">
      <button type="button" data-stoppage="-1" data-i18n-attr="aria-label:marcar.compensacao_menos">−</button>
      <output id="compensacao">+0'</output>
      <button type="button" data-stoppage="1" data-i18n-attr="aria-label:marcar.compensacao_mais">+</button>
    </div>
  </div>
  <div class="botoes">
    <button type="button" class="anular" id="acertarRepor"></button>
    <button type="button" class="arrancar" id="acertarFechar" data-i18n="marcar.feito"></button>
  </div>
</dialog>

<dialog id="exclusao">
  <h2 id="exclusaoTitulo"></h2>
  <input id="exclusaoNumero" inputmode="numeric" maxlength="3" autocomplete="off" data-i18n-attr="aria-label:marcar.exclusao_numero;placeholder:marcar.exclusao_numero">
  <div class="botoes">
    <button type="button" class="anular" id="exclusaoAcabou" data-i18n="marcar.exclusao_acabou"></button>
    <button type="button" class="arrancar" id="exclusaoFeito" data-i18n="marcar.feito"></button>
  </div>
</dialog>

<dialog id="cartao">
  <h2 id="cartaoTitulo"></h2>
  <div class="botoes cores">
    <button type="button" class="anular" data-kind="yellow"><i class="cs y" aria-hidden="true"></i><span data-i18n="marcar.cartao_amarelo"></span></button>
    <button type="button" class="anular" data-kind="red"><i class="cs r" aria-hidden="true"></i><span data-i18n="marcar.cartao_vermelho"></span></button>
  </div>
  <button type="button" class="anular fechar" id="cartaoCancelar" data-i18n="marcar.cancelar"></button>
</dialog>

<dialog id="numero">
  <h2 id="numeroTitulo"></h2>
  <div class="camisolas" id="camisolas"></div>
  <input id="numeroCampo" inputmode="numeric" maxlength="3" autocomplete="off" data-i18n-attr="aria-label:marcar.numero_camisola;placeholder:marcar.numero_camisola">
  <div class="botoes">
    <button type="button" class="anular" id="numeroOutro" data-i18n="marcar.outro_numero"></button>
    <button type="button" class="anular" id="numeroCancelar" data-i18n="marcar.cancelar"></button>
    <button type="button" class="arrancar" id="numeroFeito" data-i18n="marcar.feito"></button>
  </div>
</dialog>

<dialog id="confirmar">
  <h2 id="confirmarTitulo"></h2>
  <p id="confirmarDica"></p>
  <div class="botoes">
    <button type="button" class="anular" id="confirmarNao" data-i18n="marcar.cancelar"></button>
    <button type="button" class="arrancar" id="confirmarSim"></button>
  </div>
</dialog>

<script src="/i18n.js"></script>
<script src="/i18n/i18n.js"></script>
<script src="/marcar/marcar.js"></script>
</body>
</html>
