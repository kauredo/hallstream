<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="painel.pagina.titulo"></title>
<link rel="icon" href="/assets/icon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/icon/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/icon/apple-touch-icon.png">
<link rel="manifest" href="/painel/manifest.webmanifest">
<meta name="theme-color" content="#1C1A17">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/painel/painel.css">
</head>
<body>

<header class="top">
  <div class="brand"><img src="/assets/hallstream-lockup.svg" alt="Hallstream" width="172" height="36"></div>
  <div class="live" id="live" aria-live="off">
    <span class="score" id="liveScore">– <span>:</span> –</span>
    <span class="clock" id="liveClock"></span>
    <span class="onair" id="liveScreen" hidden></span>
    <span class="onair air" id="liveAir" hidden></span>
  </div>
</header>
<div class="banner" id="offline" hidden data-i18n="painel.offline"></div>

<div class="shell">
  <nav class="nav" role="tablist" data-i18n-attr="aria-label:painel.nav.secoes">
    <button role="tab" data-tab="jogo"><span class="num">1</span><span data-i18n="painel.nav.jogo"></span></button>
    <button role="tab" data-tab="ecras"><span class="num">2</span><span data-i18n="painel.nav.ecras"></span></button>
    <button role="tab" data-tab="plantel"><span class="num">3</span><span data-i18n="painel.nav.plantel"></span></button>
    <button role="tab" data-tab="patrocinadores"><span class="num">4</span><span data-i18n="painel.nav.patrocinadores"></span></button>
    <button role="tab" data-tab="promo"><span class="num">5</span><span data-i18n="painel.nav.promo"></span></button>
    <button role="tab" data-tab="transmissoes"><span class="num">6</span><span data-i18n="painel.nav.transmissoes"></span></button>
    <button role="tab" data-tab="definicoes"><span class="num">7</span><span data-i18n="painel.nav.definicoes"></span></button>
    <button role="tab" data-tab="caixa"><span class="num">8</span><span data-i18n="painel.nav.caixa"></span></button>
    <button role="tab" data-tab="ajuda"><span class="num">9</span><span data-i18n="painel.nav.ajuda"></span></button>
  </nav>

  <main>
    <div class="ask" id="checkAsk" hidden>
      <img src="/assets/icon/apple-touch-icon.png" alt="" width="44" height="44">
      <p class="txt"><b data-i18n="painel.atualizacao.perguntar"></b><span class="hint" data-i18n="painel.atualizacao.perguntar_dica"></span></p>
      <div class="row"><button class="btn primary" type="button" data-act="check-yes" data-i18n="painel.atualizacao.sim"></button><button class="btn quiet" type="button" data-act="check-no" data-i18n="painel.atualizacao.nao"></button><span class="msg" role="status"></span></div>
    </div>
    <div class="ask" id="updateOffer" hidden>
      <img src="/assets/icon/apple-touch-icon.png" alt="" width="44" height="44">
      <p class="txt"><b id="updateTxt" tabindex="-1"></b><span class="hint"><span id="updateHint" role="status"></span> <span id="updatePct" aria-hidden="true"></span></span></p>
      <div class="row" id="updateActs"><button class="btn primary" type="button" data-act="up-now"></button><a class="btn quiet" id="updateLink" target="_blank" rel="noopener"></a><button class="btn quiet" type="button" data-act="up-later" data-i18n="painel.atualizacao.depois"></button></div>
      <span class="ask-progress" id="updateBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-attr="aria-label:painel.atualizacao.a_transferir" hidden><i></i></span>
    </div>
    <div class="ask" id="shortcutAsk" hidden>
      <img src="/assets/icon/apple-touch-icon.png" alt="" width="44" height="44">
      <p class="txt"><b data-i18n="painel.atalho.pergunta"></b><span class="hint" data-i18n="painel.atalho.dica"></span></p>
      <div class="row"><button class="btn primary" type="button" data-act="sc-yes" data-i18n="painel.atalho.criar"></button><button class="btn quiet" type="button" data-act="sc-no" data-i18n="painel.agora_nao"></button><span class="msg" role="status"></span></div>
    </div>

    <section class="tab" id="tab-jogo" role="tabpanel" hidden>
      <h1><span data-i18n="painel.nav.jogo"></span> <button class="help-btn" type="button" data-help="ajuda-dia" data-i18n-attr="aria-label:painel.jogo.ajuda">?</button></h1>
      <p class="lead" data-i18n="painel.jogo.lead"></p>
      <div id="jogo"></div>
    </section>

    <section class="tab" id="tab-ecras" role="tabpanel" hidden>
      <h1><span data-i18n="painel.nav.ecras"></span> <button class="help-btn" type="button" data-help="ajuda-ecras" data-i18n-attr="aria-label:painel.ecras.ajuda">?</button></h1>
      <p class="lead" data-i18n="painel.ecras.lead"></p>
      <div class="ask" id="setupAsk" hidden>
        <p class="txt"><b data-i18n="painel.ecras.setup_pergunta"></b><span class="hint" data-i18n="painel.ecras.setup_dica"></span></p>
        <div class="row"><button class="btn primary" type="button" data-act="setup-go" data-i18n="painel.comecar"></button><button class="btn quiet" type="button" data-act="setup-later" data-i18n="painel.agora_nao"></button><span class="msg" role="status"></span></div>
      </div>
      <div class="card stream" id="streamBar" hidden></div>
      <div class="card yt-card" id="ytCard" role="status" hidden></div>
      <div class="chips" id="chips"></div>
      <div id="ecras"></div>
    </section>

    <section class="tab" id="tab-plantel" role="tabpanel" hidden>
      <h1 data-i18n="painel.nav.plantel"></h1>
      <p class="lead" data-i18n="painel.plantel.lead"></p>
      <div id="plantel"></div>
    </section>

    <section class="tab" id="tab-patrocinadores" role="tabpanel" hidden>
      <h1 data-i18n="painel.nav.patrocinadores"></h1>
      <p class="lead" data-i18n="painel.patrocinadores.lead"></p>
      <div id="patrocinadores"></div>
    </section>

    <section class="tab" id="tab-promo" role="tabpanel" hidden>
      <h1><span data-i18n="painel.nav.promo"></span> <button class="help-btn" type="button" data-help="ajuda-som" data-i18n-attr="aria-label:painel.promo.ajuda">?</button></h1>
      <p class="lead" data-i18n="painel.promo.lead"></p>
      <div id="promo"></div>
    </section>

    <section class="tab" id="tab-transmissoes" role="tabpanel" hidden>
      <h1><span data-i18n="painel.nav.transmissoes"></span> <button class="help-btn" type="button" data-help="ajuda-youtube" data-i18n-attr="aria-label:painel.transmissoes.ajuda">?</button></h1>
      <p class="lead" data-i18n="painel.transmissoes.lead"></p>
      <div id="transmissoes"></div>
    </section>

    <section class="tab" id="tab-definicoes" role="tabpanel" hidden>
      <h1><span data-i18n="painel.nav.definicoes"></span> <button class="help-btn" type="button" data-help="ajuda-problemas" data-i18n-attr="aria-label:painel.definicoes.ajuda">?</button></h1>
      <p class="lead" data-i18n="painel.definicoes.lead"></p>
      <div id="definicoes"></div>
    </section>

    <section class="tab" id="tab-caixa" role="tabpanel" hidden>
      <h1><span data-i18n="painel.nav.caixa"></span> <button class="help-btn" type="button" data-help="ajuda-caixa" data-i18n-attr="aria-label:painel.caixa.ajuda">?</button></h1>
      <p class="lead" data-i18n="painel.caixa.lead"></p>
      <div id="caixa"></div>
    </section>

    <section class="tab" id="tab-inicio" role="tabpanel" hidden>
      <h1 data-i18n="painel.inicio.titulo"></h1>
      <p class="lead" data-i18n="painel.inicio.lead"></p>
      <div id="inicio"></div>
    </section>

    <!-- Same steps as LEIA-ME.txt and READ-ME.txt, kept in step by hand. -->
    <section class="tab" id="tab-ajuda" role="tabpanel" hidden>
      <h1 data-i18n="painel.nav.ajuda"></h1>
      <p class="lead" data-i18n="painel.ajuda.lead"></p>
      <div id="ajuda">
        <div class="card help" id="ajuda-dia">
          <h2 data-i18n="painel.ajuda.dia.titulo"></h2>
          <span class="label" data-i18n="painel.ajuda.dia.antes"></span>
          <ol class="steps">
            <li data-i18n="painel.ajuda.dia.1"></li>
            <li data-i18n="painel.ajuda.dia.2"></li>
            <li data-i18n-html="painel.ajuda.dia.3"></li>
            <li data-i18n-html="painel.ajuda.dia.4"></li>
            <li data-i18n-html="painel.ajuda.dia.5"></li>
          </ol>
          <span class="label" id="ajuda-ecras" data-i18n="painel.ajuda.dia.na_transmissao"></span>
          <ol class="steps" start="6">
            <li data-i18n-html="painel.ajuda.dia.6"></li>
            <li data-i18n-html="painel.ajuda.dia.7"></li>
            <li data-i18n-html="painel.ajuda.dia.8"></li>
            <li data-i18n-html="painel.ajuda.dia.9"></li>
            <li data-i18n-html="painel.ajuda.dia.10"></li>
          </ol>
          <span class="label" data-i18n="painel.ajuda.dia.no_fim"></span>
          <ol class="steps" start="11">
            <li data-i18n-html="painel.ajuda.dia.11"></li>
            <li data-i18n-html="painel.ajuda.dia.12"></li>
            <li data-i18n-html="painel.ajuda.dia.13"></li>
          </ol>
          <p class="hint" data-i18n-html="painel.ajuda.dia.periodos"></p>
        </div>

        <div class="card help" id="ajuda-inicio">
          <h2 data-i18n="painel.ajuda.inicio.titulo"></h2>
          <p data-i18n-html="painel.ajuda.inicio.texto"></p>
          <p class="hint" data-i18n-html="painel.ajuda.inicio.dica"></p>
        </div>

        <div class="card help" id="ajuda-pc-novo">
          <h2 data-i18n="painel.ajuda.pc.titulo"></h2>
          <ol class="steps">
            <li data-i18n-html="painel.ajuda.pc.1"></li>
            <li data-i18n-html="painel.ajuda.pc.2"></li>
            <li data-i18n-html="painel.ajuda.pc.3"></li>
            <li data-i18n-html="painel.ajuda.pc.4"></li>
            <li data-i18n-html="painel.ajuda.pc.5"></li>
          </ol>
          <p class="hint" data-i18n-html="painel.ajuda.pc.dica"></p>
        </div>

        <div class="card help" id="ajuda-youtube">
          <h2 data-i18n="painel.ajuda.yt.titulo"></h2>
          <ol class="steps">
            <li data-i18n-html="painel.ajuda.yt.1"></li>
            <li data-i18n-html="painel.ajuda.yt.2"></li>
            <li data-i18n-html="painel.ajuda.yt.3"></li>
          </ol>
          <p class="hint" data-i18n-html="painel.ajuda.yt.dica"></p>
        </div>

        <div class="card help" id="ajuda-problemas">
          <h2 data-i18n="painel.ajuda.problemas.titulo"></h2>
          <ul class="faq">
            <li id="ajuda-caixa"><b data-i18n="painel.ajuda.problemas.caixa"></b>
              <p data-i18n-html="painel.ajuda.problemas.caixa_texto"></p>
              <a href="#caixa" data-goto="caixa" data-i18n="painel.ajuda.problemas.abrir_caixa"></a></li>
            <li id="ajuda-obs"><b data-i18n="painel.ajuda.problemas.obs"></b>
              <p data-i18n-html="painel.ajuda.problemas.obs_texto"></p>
              <a href="#definicoes" data-goto="definicoes" data-i18n="painel.ajuda.problemas.abrir_definicoes"></a></li>
            <li id="ajuda-som"><b data-i18n="painel.ajuda.problemas.som"></b>
              <p data-i18n-html="painel.ajuda.problemas.som_texto"></p>
              <a href="#promo" data-goto="promo" data-i18n="painel.ajuda.problemas.abrir_promo"></a></li>
            <li id="ajuda-camara"><b data-i18n="painel.ajuda.problemas.camara"></b>
              <p data-i18n-html="painel.ajuda.problemas.camara_texto"></p>
              <a href="#definicoes" data-goto="definicoes" data-i18n="painel.ajuda.problemas.abrir_definicoes"></a></li>
            <li id="ajuda-telemovel"><b data-i18n="painel.ajuda.problemas.telemovel"></b>
              <p data-i18n-html="painel.ajuda.problemas.telemovel_texto"></p>
              <a href="#definicoes" data-goto="definicoes" data-i18n="painel.ajuda.problemas.abrir_definicoes"></a></li>
            <li id="ajuda-numero"><b data-i18n="painel.ajuda.problemas.numero"></b>
              <p data-i18n-html="painel.ajuda.problemas.numero_texto"></p></li>
            <li id="ajuda-outro"><b data-i18n="painel.ajuda.problemas.outro"></b>
              <p data-i18n-html="painel.ajuda.problemas.outro_texto"></p></li>
          </ul>
        </div>

        <div class="card help" id="ajuda-ficheiros">
          <h2 data-i18n="painel.ajuda.ficheiros.titulo"></h2>
          <div id="ajudaDir"><p class="hint" data-i18n-html="painel.ajuda.ficheiros.pasta"></p></div>
          <ul class="files">
            <li data-i18n-html="painel.ajuda.ficheiros.marcador"></li>
            <li data-i18n-html="painel.ajuda.ficheiros.raw"></li>
            <li data-i18n-html="painel.ajuda.ficheiros.bluetooth"></li>
            <li data-i18n-html="painel.ajuda.ficheiros.promo"></li>
          </ul>
          <p class="hint" data-i18n-html="painel.ajuda.ficheiros.dica"></p>
        </div>

        <div class="card help" id="ajuda-feedback">
          <h2 data-i18n="painel.feedback.titulo"></h2>
          <form id="feedbackForm" class="stack" hidden>
            <p class="hint" data-i18n="painel.feedback.form_texto"></p>
            <div class="cols">
              <label class="field"><span data-i18n="painel.feedback.tipo"></span><select name="type">
                <option value="bug" data-i18n="painel.feedback.tipo_bug"></option>
                <option value="feature" data-i18n="painel.feedback.tipo_ideia"></option>
                <option value="feedback" data-i18n="painel.feedback.tipo_outro"></option>
              </select></label>
              <label class="field"><span data-i18n="painel.feedback.assunto"></span><input name="title" maxlength="200" required></label>
            </div>
            <label class="field"><span data-i18n="painel.feedback.descricao"></span><textarea name="description" rows="5" maxlength="10000" required></textarea></label>
            <div class="row" style="align-items:center"><button class="btn primary" type="submit" data-i18n="painel.feedback.enviar"></button><span class="msg" role="status"></span></div>
          </form>
          <p id="feedbackOr" class="hint" data-i18n="painel.feedback.ou_github" hidden></p>
          <p id="feedbackGh" data-i18n="painel.feedback.texto"></p>
          <div class="row"><button class="btn" type="button" data-act="feedback" data-i18n="painel.feedback.botao"></button></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="row">
      <button class="btn" id="modalNo" type="button" data-i18n="painel.cancelar"></button>
      <button class="btn primary" id="modalYes" type="button" data-i18n="painel.confirmar"></button>
    </div>
  </div>
</div>

<div class="modal" id="pin" hidden>
  <form class="box" id="pinForm" role="dialog" aria-modal="true" aria-labelledby="pinTitle">
    <h2 id="pinTitle" data-i18n="painel.pin.titulo"></h2>
    <p class="hint" data-i18n="painel.pin.dica"></p>
    <input class="pin-input" id="pinValue" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-label="PIN">
    <p class="msg err" id="pinMsg"></p>
    <div class="row"><button class="btn primary" type="submit" data-i18n="painel.pin.entrar"></button></div>
  </form>
</div>

<script src="/i18n.js"></script>
<script src="/i18n/i18n.js"></script>
<script src="/painel/mock.js"></script>
<script src="/painel/resultado.js"></script>
<script src="/painel/miniatura.js"></script>
<script src="/painel/painel.js"></script>
</body>
</html>
